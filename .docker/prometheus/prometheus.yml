global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "import-export-api"
    metrics_path: "/api/v1/metrics"
    scrape_interval: 10s
    static_configs:
      - targets: ["nginx:80"]
        labels:
          app: "import-export-api"
          environment: "development"
