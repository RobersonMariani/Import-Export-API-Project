[www]
user = www-data
group = www-data

listen = 9000

; --- Pool Management: dynamic ---
pm = dynamic

; Max child processes — dimensionado para 500+ requests simultâneos
pm.max_children = 512

; Processes started on boot
pm.start_servers = 50

; Min idle servers ready for requests
pm.min_spare_servers = 20

; Max idle servers (excess killed)
pm.max_spare_servers = 100

; Requests before worker recycle (prevents memory leaks)
pm.max_requests = 1000

; Max seconds a child waits for new connection
pm.process_idle_timeout = 10s

; Slow request log threshold
request_slowlog_timeout = 10s
slowlog = /proc/self/fd/2

; Kill worker if request exceeds this
request_terminate_timeout = 300s

; Status page for monitoring
pm.status_path = /fpm-status

; Clear env for security
clear_env = no
